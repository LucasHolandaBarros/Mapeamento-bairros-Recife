                  var container = document.getElementById('mynetwork');

                  nodes = new vis.DataSet([{"color": "#00FFAA", "font": {"color": "white"}, "id": "Agua Fria", "label": "Agua Fria", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Arruda", "label": "Arruda", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "San Martin", "label": "San Martin", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Jardim Sao Paulo", "label": "Jardim Sao Paulo", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Boa Vista", "label": "Boa Vista", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Sao Jose", "label": "Sao Jose", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Campo Grande", "label": "Campo Grande", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Fundao", "label": "Fundao", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Coelhos", "label": "Coelhos", "shape": "dot", "size": 32}, {"color": "#00FFAA", "font": {"color": "white"}, "id": "Ponto De Parada", "label": "Ponto De Parada", "shape": "dot", "size": 32}]);

};
